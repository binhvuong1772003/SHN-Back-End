services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shn-backend
    command: npm run dev
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MCP_SERVER_URL: http://mcp-server:8080/mcp
    depends_on:
      redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shn-mcp-server
    command: npm run dev:mcp
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      MCP_PORT: 8080
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - mcp_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          require('http').get('http://127.0.0.1:8080/health',
          response => process.exit(response.statusCode === 200 ? 0 : 1))
          .on('error', () => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shn-email-worker
    command: npm run dev:worker
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - worker_node_modules:/app/node_modules
    restart: unless-stopped

  staff-invite-worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: shn-staff-invite-worker
    command: npm run dev:staff-invite-worker
    env_file:
      - .env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - invite_worker_node_modules:/app/node_modules
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: shn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: shn-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis_data:
  backend_node_modules:
  worker_node_modules:
  invite_worker_node_modules:
  mcp_node_modules:
  prometheus_data:
  grafana_data:
